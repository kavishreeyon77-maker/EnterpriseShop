spring:
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Dev uses simple map cache and disables RabbitMQ by default
# so it can run out of the box locally without Docker.
# RabbitMQ functionality is mocked/synchronous in dev if unavailable.

logging:
  level:
    com.enterprise.cartcheckout: TRACE
